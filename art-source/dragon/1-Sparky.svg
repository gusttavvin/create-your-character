    <path fill="none" stroke="#3FA62B" stroke-width="9" d="M315 318 C350 262 384 206 420 166 C444 140 476 122 508 116"/>
    <path fill="none" stroke-width="2" d="M315 318 C350 262 384 206 420 166 C444 140 476 122 508 116"/>

    <!-- feet -->
    <ellipse fill="url(#skin)" cx="204" cy="530" rx="46" ry="30"/>
    <ellipse fill="url(#skin)" cx="316" cy="530" rx="46" ry="30"/>
    <path fill="#FFFFFF" stroke-width="3" d="M176 548 L182 562 L190 548 Z M196 552 L203 566 L210 552 Z M216 548 L223 562 L230 548 Z"/>
    <path fill="#FFFFFF" stroke-width="3" d="M290 548 L297 562 L304 548 Z M310 552 L317 566 L324 552 Z M330 548 L337 562 L344 548 Z"/>

