<svg viewBox="0 0 520 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A4EE78"/>
      <stop offset="0.55" stop-color="#6FD14A"/>
      <stop offset="1" stop-color="#3FA62B"/>
    </linearGradient>
    <linearGradient id="belly" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFF8D2"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <linearGradient id="horn" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF6E4"/>
      <stop offset="1" stop-color="#FFD9A6"/>
