    <linearGradient id="wing" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset="1" stop-color="#FFC93D"/>
    </linearGradient>
  </defs>
  <g stroke="#0B1B3B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
