    <path fill="url(#belly)" d="M260 346 C300 346 326 384 326 432 C326 482 298 510 260 510 C222 510 194 482 194 432 C194 384 220 346 260 346 Z"/>
    <path fill="none" stroke="#E2B24A" stroke-width="3" d="M210 384 Q260 396 310 384 M200 416 Q260 430 320 416 M198 450 Q260 464 322 450 M206 482 Q260 496 314 482"/>

