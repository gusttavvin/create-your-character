    <path fill="#FFFFFF" stroke-width="3" d="M236 284 L243 298 L250 287 Z"/>
    <path fill="#FF8FAE" stroke="none" d="M246 304 C252 298 268 298 274 304 C270 309 250 309 246 304 Z"/>

